# Reminder workflow — actual deploy is via Vercel + Render dashboards or CLI.
# Push to main does NOT auto-deploy unless you connect Vercel/Render Git integration.

name: Deploy checklist

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  verify-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -c "from app.main import app; print('routes', len(app.routes))"

  hint:
    needs: verify-backend
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "Backend OK. Deploy manually:"
          echo "1. Render -> apps/backend (see deploy/generated/render.env)"
          echo "2. Vercel -> apps/frontend"
          echo "3. Run deploy/one-click-deploy.ps1 locally for secrets"
